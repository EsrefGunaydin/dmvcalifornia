name: DMVCalifornia
options:
  bundleIdPrefix: us.dmvcalifornia
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"

packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: "11.0.0"

targets:
  DMVCalifornia:
    type: application
    platform: iOS
    sources:
      - path: DMVCalifornia
        excludes:
          - "**/*.md"
          - "**/Package.swift"
          - "**/Package.resolved"
          - "**/.build/**"
          - "**/.swiftpm/**"
          - "**/Tests/**"
          - "**/__Snapshots__/**"
          - "**/.git/**"
    resources:
      - path: DMVCalifornia/Resources/Assets.xcassets
      - path: DMVCalifornia/Resources/Data
    settings:
      base:
        INFOPLIST_FILE: DMVCalifornia/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: us.dmvcalifornia.app
        CODE_SIGN_ENTITLEMENTS: DMVCalifornia/DMVCalifornia.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: GoogleMobileAds
    entitlements:
      path: DMVCalifornia/DMVCalifornia.entitlements
      properties:
        com.apple.security.application-groups:
          - group.us.dmvcalifornia.app

schemes:
  DMVCalifornia:
    build:
      targets:
        DMVCalifornia: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
